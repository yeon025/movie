services:
  postgres:
    image: pgvector/pgvector:pg16

    environment:
      POSTGRES_DB: movie
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  spring:
    image: gradle:8.7-jdk21
    working_dir: /app

    volumes:
      - ../spring:/app
      - gradle-cache:/home/gradle/.gradle

    command: ./gradlew bootRun --no-daemon

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/movie
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      JWT_SECRET: dev_jwt_secret_change_me
      KMDB_API_KEY: ${KMDB_API_KEY}
      AI_SERVICE_URL: http://backend-ai:8000

  fastapi:
    build:
      context: ../fastapi
      dockerfile: Dockerfile

    volumes:
      - ../fastapi:/app

    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/movie
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EMBEDDING_MODEL: gemini-embedding-001
      EMBEDDING_DIMENSION: 1536

    ports:
      - "8000:8000"

volumes:
  postgres-data:
  gradle-cache:

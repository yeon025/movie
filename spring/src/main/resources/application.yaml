spring:
  application:
    name: spring

  datasource:
    url: jdbc:postgresql://localhost:5432/movie
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect


tmdb:
  api:
    key: ${TMDB_API_KEY}
    url: https://api.themoviedb.org/3


jwt:
  secret: ${JWT_SECRET}
  expiration: 300000


logging:
  level:
    root: INFO
    com.example.spring: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: trace
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%-5level] [%logger{36}] %msg%n"
